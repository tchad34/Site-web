<style>
/* Page Films indépendante : aucun changement au système des autres pages. */
.films-page-wrap{padding:28px 34px 50px}
.films-page-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
.films-page-top h1{margin:0}
.films-page-back{color:inherit;text-decoration:none;opacity:.8;font-size:14px}

.films-page-nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.films-page-nav a{color:inherit;text-decoration:none}
/* Supprime le petit effet carré de pression/focus sur les boutons de genre mobile. */
#genreFilters .chip{outline:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.film-link,.film-link:focus,.film-link:focus-visible,.film-link:active{outline:none;-webkit-tap-highlight-color:transparent;box-shadow:none}
.film-link{color:inherit;text-decoration:none;display:block}
#genreFilters .chip:focus,#genreFilters .chip:focus-visible,#genreFilters .chip:active{outline:none;box-shadow:none}
.film-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0}.card:after{z-index:1}.card b,.card small,.progress,.film-open{z-index:2}
@media(max-width:700px){.films-page-wrap{padding:22px 16px 40px}.films-page-top{align-items:flex-start;flex-direction:column}}
</style>

h:100%;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:18px;background:#17191e;display:block}.preview-eyebrow{font-size:11px;letter-spacing:4px;color:#d7b968;margin:2px 0 12px}.preview-title{font:500 clamp(28px,4vw,38px) Georgia,serif;line-height:1.05;margin:0 0 10px;color:#f4f4f5}.preview-meta{font-size:13px;line-height:1.5;color:#b6bbc2}.preview-rating{display:flex;align-items:center;gap:7px;margin:12px 0;color:#efc95f;font-size:18px}.preview-rating small{font-size:12px;color:#c5c8cd}.synopsis-box{margin-top:12px;padding:0;border:0;border-radius:0;background:transparent;width:100%;max-width:none;box-sizing:border-box}.synopsis-box h2{font-size:17px;margin:0 0 8px}.preview-synopsis{font-size:13px;line-height:1.5;color:#b4b8be;margin:0;width:100%;max-width:none;box-sizing:border-box;display:block;overflow:hidden}.preview-synopsis.expanded{display:block}.read-more{margin-top:8px;border:0;background:none;color:#f2cc69;font-weight:700;font-size:13px;padding:0;cursor:pointer}.preview-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px;width:100%;box-sizing:border-box}.preview-actions a,.preview-actions button{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-width:0;height:46px;min-height:46px;box-sizing:border-box;padding:0 10px;border-radius:24px;border:1px solid #30343c;font-family:inherit;font-size:13px;font-weight:700;line-height:1;text-decoration:none;white-space:nowrap;appearance:none;-webkit-appearance:none;cursor:pointer}.preview-actions .primary{background:#f2cc69;color:#19150b;border-color:#f2cc69}.preview-actions button{background:#17191e;color:#f2f2f3;border-color:#30343c}.similar{margin-top:18px;padding-top:16px;border-top:1px solid #2b2f36}.similar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 11px}.similar h2{font-size:17px;margin:0}.similar-more{border:0;background:none;color:#f2cc69;font-weight:700;font-size:13px;padding:0;cursor:pointer;white-space:nowrap}.similar-grid{display:grid;grid-template-columns:repeat(4,minmax(55px,1fr));gap:9px}.similar-card{min-width:0;color:inherit;text-decoration:none}.similar-card img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:11px;background:#17191e;display:block}.similar-card b{display:block;font-size:11px;line-height:1.2;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.similar-card small{display:block;color:#858b93;font-size:10px;margin-top:3px}@media(max-width:700px){.films-page-wrap{padding:12px 8px 30px;overflow-x:hidden;box-sizing:border-box}.films-layout3{grid-template-columns:94px minmax(0,1fr);gap:8px;width:100%;min-width:0}.films-selection{height:auto;min-height:0;border-radius:18px;min-width:0}.selection-head{height:46px;padding:0 8px}.selection-head strong{font-size:13px}.selection-head span{font-size:10px}.selection-list{height:auto;flex:1;min-height:0;padding:7px 2px 12px}.selection-item{display:block;width:88px;max-width:88px;box-sizing:border-box;padding:2px;border-radius:13px;margin:0 auto 4px;min-width:0;text-align:center}.selection-item img{border-radius:8px;width:84px;height:126px;aspect-ratio:2/3;object-fit:cover;max-width:145px;margin:0 auto}.selection-item .stitle{display:block;width:84px;max-width:84px;margin:5px auto 0;font-size:10px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selection-item .syear{font-size:9px;margin-top:2px}.film-preview{padding:10px;border-radius:18px;min-width:0;width:100%;box-sizing:border-box}.preview-top{grid-template-columns:92px minmax(0,1fr);gap:9px;min-width:0}.preview-poster{border-radius:12px}.preview-eyebrow{font-size:8px;letter-spacing:2.5px;margin:1px 0 6px;white-space:nowrap}.preview-title{font-size:18px;line-height:1.05;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview-meta{font-size:9px;line-height:1.35;overflow-wrap:normal}.preview-rating{font-size:13px;gap:4px;margin:7px 0;white-space:nowrap}.preview-rating small{font-size:8px;white-space:nowrap}.synopsis-box{padding:0;margin-top:12px;border-radius:0;min-width:0}.synopsis-box h2{font-size:13px;margin-bottom:5px}.preview-synopsis{font-size:9px;line-height:1.35;-webkit-line-clamp:3;overflow:hidden}.read-more{font-size:10px;margin-top:5px}.preview-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:12px;width:100%;box-sizing:border-box}.preview-actions a,.preview-actions button{height:42px;min-height:42px;padding:0 7px;font-size:11px}.similar{margin-top:11px;padding-top:10px}.similar-head{margin-bottom:8px}.similar h2{font-size:14px}.similar-more{font-size:10px}.similar-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.similar-card b{font-size:7px;line-height:1.2}.similar-card small{font-size:8px}}
</style></head>
<body>
<script src="/site-header.js"></script>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="index.html">N</a>
    <a class="side-btn" href="index.html" title="Accueil">⌂</a>
    <a class="side-btn active" href="films.html" title="Films">▣</a>
    <a class="side-btn" href="index.html#series" title="Séries">▤</a>
    <a class="side-btn" href="index.html#cinema" title="Au cinéma">◉</a>
    <a class="side-btn" href="index.html#list" title="Ma liste">♡</a>
    <div class="side-spacer"></div>

  <main class="main">
    <header class="topbar">
      <a class="wordmark" href="index.html">Nox<span>Stream</span></a>
      <nav class="topnav">
        <a class="toplink" href="index.html">Accueil</a>
        <a class="toplink active" href="films.html">Films</a>
        <a class="toplink" href="index.html#series">Séries</a>

      </nav>
      <a class="search-mini" href="index.html#search">⌕ <span>Rechercher...</span></a>
    </header>
    <section class="films-page-wrap films-style3"><div class="films-breadcrumb">← Retour à l'accueil <span>•</span> Films</div><div class="films-filters" id="genreFilters"><button class="chip active" type="button" data-genre="Tous">Tous</button><button class="chip" type="button" data-genre="Action">Action</button><button class="chip" type="button" data-genre="Animation">Animation</button><button class="chip" type="button" data-genre="Arts-martiaux">Arts-martiaux</button><button class="chip" type="button" data-genre="Aventure">Aventure</button><button class="chip" type="button" data-genre="Biopic">Biopic</button><button class="chip" type="button" data-genre="Comédie">Comédie</button><button class="chip" type="button" data-genre="Comédie Dramatique">Comédie Dramatique</button><button class="chip" type="button" data-genre="Crime">Crime</button><button class="chip" type="button" data-genre="Documentaire">Documentaire</button><button class="chip" type="button" data-genre="Drame">Drame</button><button class="chip" type="button" data-genre="Epouvante-horreur">Epouvante-horreur</button><button class="chip" type="button" data-genre="Erotique">Erotique</button><button class="chip" type="button" data-genre="Espionnage">Espionnage</button><button class="chip" type="button" data-genre="Exclue">Exclue</button><button class="chip" type="button" data-genre="Famille">Famille</button><button class="chip" type="button" data-genre="Fantastique">Fantastique</button><button class="chip" type="button" data-genre="Film">Film</button><button class="chip" type="button" data-genre="Film Ancien">Film Ancien</button><button class="chip" type="button" data-genre="Guerre">Guerre</button><button class="chip" type="button" data-genre="Historique">Historique</button><button class="chip" type="button" data-genre="Musical">Musical</button><button class="chip" type="button" data-genre="Policier">Policier</button><button class="chip" type="button" data-genre="Romance">Romance</button><button class="chip" type="button" data-genre="Science Fiction">Science Fiction</button><button class="chip" type="button" data-genre="Series">Series</button><button class="chip" type="button" data-genre="Spectacles">Spectacles</button><button class="chip" type="button" data-genre="Thriller">Thriller</button><button class="chip" type="button" data-genre="VF">VF</button><button class="chip" type="button" data-genre="Western">Western</button></div><div class="films-layout3"><aside class="films-selection"><div class="selection-head"><strong>Films</strong></div><div class="selection-list" id="selectionList"></div></aside><article class="film-preview" id="filmPreview"></article></div><p class="films-note" id="filmsNote"></p></section>
  </main>
</div>
<script>
let allFilms=[],films=[],currentIndex=0,filmImages={},dataCache=new Map(),detailsManifest=null,detailsCache=new Map();
const listEl=document.getElementById('selectionList'),previewEl=document.getElementById('filmPreview');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const normImg=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\.(jpg|jpeg|png|webp)$/,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const aliases={"'71 (2014)":"https://pub-8f45777ec3cc4df7bbbac0efe48a9d90.r2.dev/71_%282014%29.jpg","100° Below Zero":"https://pub-8f45777ec3cc4df7bbbac0efe48a9d90.r2.dev/100%C2%B0_Below_Zero.jpg","10 Minutes Gone":"https://pub-8f45777ec3cc4df7bbbac0efe48a9d90.r2.dev/10_Minutes_Gone.jpg","10th and Wolf":"https://pub-8f45777ec3cc4df7bbbac0efe48a9d90.r2.dev/10th_and_Wolf.jpg"};
function imageFor(t){if(filmImages[t])return filmImages[t];if(aliases[t])return aliases[t];const n=normImg(t),k=Object.keys(filmImages).find(x=>normImg(x)===n);return k?filmImages[k]:''}
async function loadImages(){try{const m=await fetch('images-films/manifest.json').then(r=>r.json());const files=[...new Set(Object.values(m.films||{}).map(x=>x.file).filter(Boolean))];const a=await Promise.all(files.map(f=>fetch('images-films/'+f).then(r=>r.json())));a.forEach(x=>Object.assign(filmImages,x));}catch(e){}}
async function loadFilmDetails(f){
  try{
    if(!detailsManifest) detailsManifest=await fetch('details/manifest.json').then(r=>r.json());
    const key=String(f.file||'').split('/').pop().replace(/\.html$/i,'');
    const ref=detailsManifest?.films?.[key];
    if(!ref||!ref.file)return null;
    let chunk=detailsCache.get(ref.file);
    if(!chunk){chunk=await fetch('details/'+ref.file).then(r=>r.json());detailsCache.set(ref.file,chunk)}
    if(!Array.isArray(chunk))return null;
    return chunk.find(x=>x&&((x.id===key)||(x.source===f.file)||(x.title===f.title)))||null;
  }catch(e){return null}
}
async function dataFor(f){
  if(dataCache.has(f.file))return dataCache.get(f.file);
  let d={};
  try{
    const h=await fetch(f.file).then(r=>r.text()),m=h.match(/window\.NOX_FILM_DATA\s*=\s*(\{[\s\S]*?\})\s*;<\/script>/);
    if(m)d=JSON.parse(m[1]);
  }catch(e){}
  const detail=await loadFilmDetails(f);
  if(detail)d={...detail,...d,synopsis:d.synopsis||detail.synopsis};
  d={...d,title:d.title||f.title,image:d.image||imageFor(f.title),year:d.year||f.year,genre:d.genre||f.genre,duration:d.duration||'',origin:d.origin||'',director:d.director||'',actors:d.actors||'',synopsis:d.synopsis||'Synopsis non disponible pour ce film.'};
  dataCache.set(f.file,d);return d;
}
function drawList(){listEl.innerHTML=films.map((f,i)=>`<button class="selection-item${i===currentIndex?' active':''}" data-i="${i}"><img src="${esc(imageFor(f.title))}" alt=""><span><span class="stitle">${esc(f.title)}</span><span class="syear">${esc(f.year)}</span></span></button>`).join('');listEl.querySelectorAll('.selection-item').forEach(b=>b.onclick=()=>{currentIndex=+b.dataset.i;drawList();drawPreview()})}
function syncSelectionHeight(){const selection=document.querySelector('.films-selection');if(!selection)return;selection.style.height=previewEl.offsetHeight+'px';}

async function drawPreview(){const f=films[currentIndex];if(!f)return;const d=await dataFor(f);const normGenre=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[–—-]/g,' ').replace(/\s+/g,' ').trim();
const currentGenre=normGenre(f.genre);
const sameGenre=films.filter(x=>x!==f && normGenre(x.genre)===currentGenre);
const others=films.filter(x=>x!==f && normGenre(x.genre)!==currentGenre);
const sim=[...sameGenre,...others].slice(0,6);previewEl.innerHTML=`<div class="preview-top"><img class="preview-poster" src="${esc(d.image||imageFor(f.title))}" alt=""><div><div class="preview-eyebrow">FICHE FILM</div><h1 class="preview-title">${esc(d.title)}</h1><div class="preview-meta">${esc(d.year)}${d.duration?' · '+esc(d.duration):''}<br>${esc(d.genre)}</div><div class="preview-rating">★★★★<span style="color:#45484d">★</span><small>4.2 (12k)</small></div></div></div><div class="synopsis-box"><h2>Synopsis</h2><p class="preview-synopsis">${esc(d.synopsis)}</p><button class="read-more" type="button">Lire plus⌄</button></div><div class="preview-actions"><a class="primary" href="${esc(f.file)}">▷&nbsp; Regarder</a><button>＋&nbsp; Ma liste</button></div><div class="similar"><div class="similar-head"><h2>Films similaires</h2><button class="similar-more" type="button">Voir tout&nbsp;›</button></div><div class="similar-grid">${sim.map(x=>`<a class="similar-card" href="#" data-file="${esc(x.file)}"><img src="${esc(imageFor(x.title))}" alt=""><b>${esc(x.title)}</b><small>${esc(x.year)}</small></a>`).join('')}</div></div>`;const more=previewEl.querySelector('.read-more');const syn=previewEl.querySelector('.preview-synopsis');if(more&&syn)more.onclick=()=>{const open=syn.classList.toggle('expanded');more.textContent=open?'Réduire⌃':'Lire plus⌄';requestAnimationFrame(syncSelectionHeight)};previewEl.querySelectorAll('[data-file]').forEach(a=>a.onclick=e=>{e.preventDefault();currentIndex=films.findIndex(x=>x.file===a.dataset.file);drawList();drawPreview()});requestAnimationFrame(syncSelectionHeight)}
function filterByGenre(g){const n=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[–—-]/g,' ').replace(/\s+/g,' ').trim();document.querySelectorAll('#genreFilters .chip').forEach(b=>b.classList.toggle('active',b.dataset.genre===g));if(g==='Tous')films=[...allFilms];else{const a={'science-fiction':['science fiction','science-fiction'],'comédie':['comedie','comédie'],'horreur':['horreur','epouvante horreur','epouvante-horreur']};const w=(a[g]||[n(g)]).map(n);films=allFilms.filter(f=>String(f.genre).split(/[,|;/]/).map(n).some(x=>w.includes(x)))}currentIndex=0;drawList();drawPreview()}
document.getElementById('genreFilters').onclick=e=>{const b=e.target.closest('.chip');if(b)filterByGenre(b.dataset.genre)};
const previewResizeObserver=new ResizeObserver(()=>requestAnimationFrame(syncSelectionHeight));previewResizeObserver.observe(previewEl);window.addEventListener('resize',()=>requestAnimationFrame(syncSelectionHeight));
(async()=>{const r=await fetch('Films/catalogue.json');const d=await r.json();allFilms=d.map(x=>({title:x.title||x.name||'Film',year:x.year||'',genre:x.genre||'',file:x.file||''}));films=[...allFilms];await loadImages();drawList();drawPreview()})().catch(()=>document.getElementById('filmsNote').textContent='Impossible de charger le catalogue.');
</script>
